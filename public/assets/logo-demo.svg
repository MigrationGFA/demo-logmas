<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Demo Local Government Council emblem">
  <defs>
    <linearGradient id="demoShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#052e1b" />
    </linearGradient>
    <linearGradient id="demoRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a017" />
      <stop offset="100%" stop-color="#f5d76e" />
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="57" fill="#f5d76e" />
  <circle cx="60" cy="60" r="53" fill="url(#demoShield)" />

  <!-- Shield body -->
  <path d="M60 22 L88 33 V60 C88 78 75 92 60 99 C45 92 32 78 32 60 V33 Z"
        fill="#ffffff" opacity="0.08" />
  <path d="M60 25 L85 35 V60 C85 76.5 73.5 89.5 60 96 C46.5 89.5 35 76.5 35 60 V35 Z"
        fill="none" stroke="#f5d76e" stroke-width="2.5" />

  <!-- Laurel / unity mark -->
  <path d="M60 40 V82" stroke="#f5d76e" stroke-width="3" stroke-linecap="round" />
  <path d="M60 50 C52 46 48 40 47 33 C54 35 59 41 60 50 Z" fill="#4ade80" />
  <path d="M60 50 C68 46 72 40 73 33 C66 35 61 41 60 50 Z" fill="#4ade80" />
  <path d="M60 66 C52 62 48 56 47 49 C54 51 59 57 60 66 Z" fill="#22c55e" />
  <path d="M60 66 C68 62 72 56 73 49 C66 51 61 57 60 66 Z" fill="#22c55e" />

  <!-- Book of record -->
  <rect x="47" y="72" width="26" height="12" rx="2" fill="#f5d76e" opacity="0.92" />
  <rect x="59" y="72" width="2" height="12" fill="#052e1b" />

  <!-- DEMO ribbon -->
  <rect x="24" y="96" width="72" height="16" rx="8" fill="url(#demoRibbon)" />
  <text x="60" y="108.5" text-anchor="middle"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="11" font-weight="700" letter-spacing="2" fill="#052e1b">DEMO</text>
</svg>
